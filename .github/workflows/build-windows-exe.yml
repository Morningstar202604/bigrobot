name: Build Windows exe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          "ver=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build and smoke-test exe
        run: python scripts/build_exe.py --clean
      - name: Name release artifact
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.ver }}"
          $name = "bigrobot-$ver-win64.exe"
          Copy-Item dist-exe/bigrobot.exe "dist-exe/$name"
          Get-FileHash "dist-exe/$name" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $name" } |
            Set-Content dist-exe/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bigrobot-${{ steps.version.outputs.ver }}-win64
          path: |
            dist-exe/bigrobot-${{ steps.version.outputs.ver }}-win64.exe
            dist-exe/SHA256SUMS.txt
          if-no-files-found: error
